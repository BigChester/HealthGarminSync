name: CI

on:
  push:
    branches: [develop, master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime and development dependencies
        run: make dev PYTHON=python
      - name: Check formatting and syntax
        run: make check PYTHON=python
      - name: Run offline tests with the reviewed SDK
        run: make test PYTHON=python

  apple-health:
    name: Apple Health bridge / Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check Swift formatting and app configuration
        run: make check-bridge
      - name: Test import, recovery, and Python to Swift exchange
        run: make test-bridge PYTHON=python
      - name: Build the iOS app with Apple SDK
        run: make build-ios
      - name: Install and launch an isolated iOS Simulator
        run: python scripts/test_ios_launch.py --app .build/ios/Build/Products/Debug-iphonesimulator/GarminHealthBridge.app --screenshot .build/ios/simulator-start.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-bridge-simulator
          path: .build/ios/simulator-start.png
          retention-days: 7

  apple-health-sdk:
    name: Apple Health / latest SDK
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build with the current Apple SDK
        run: make build-ios
